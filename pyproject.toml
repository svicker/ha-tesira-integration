[project]
name = "ha-tesira-integration"
version = "2.0.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["old"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components/tesira"]
ignore_missing_imports = true
